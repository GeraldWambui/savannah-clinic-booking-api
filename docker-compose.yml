version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: clinic_db
    restart: always
    environment:
      POSTGRES_USER: clinic_user
      POSTGRES_PASSWORD: clinic_password
      POSTGRES_DB: clinic_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic_user -d clinic_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinic_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://clinic_user:clinic_password@db:5432/clinic_db
      - ENVIRONMENT=production
      - PORT=8000
    ports:
      - "8000:8000"

volumes:
  postgres_data:
